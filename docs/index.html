<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111822">
    <meta name="description" content="Minecraft Java 26.2の頭表示をサイズ・Yオフセットで調整するリソースパックとコマンド生成ツール。">
    <title>TextHeadGlyph — 頭表示のコマンド生成</title>
    <link rel="stylesheet" href="styles.css?v=selection-8">
    <script type="module" src="app.mjs?v=component-copy-7"></script>
  </head>
  <body>
    <main>
      <div class="page-tools">
        <span class="version">Java Edition 26.2</span>
        <a class="download" href="https://github.com/nea-c/TextHeadGlyph/releases/download/r1/TextHeadGlyph-26.2.zip">リソースパックをダウンロード</a>
      </div>

      <div class="workspace">
        <section class="controls" aria-labelledby="settings-title">
          <h2 id="settings-title">表示の設定</h2>
          <form id="settings" novalidate>
            <label for="player">MCID</label>
            <div class="input-row">
              <input id="player" name="player" value="Alex" maxlength="16" spellcheck="false" autocomplete="off" required>
              <button type="button" id="load-skin" class="secondary">スキン取得</button>
            </div>
            <p class="field-note" id="skin-status" role="status">標準Alexを表示しています。</p>

            <div class="number-label"><label for="size">サイズ</label><span>1〜255</span></div>
            <div class="input-row measure"><input id="size" name="size" type="number" min="1" max="255" step="1" value="8" required><span>× <output id="size-echo">8</output> GUI単位</span></div>
            <input id="size-range" type="range" min="1" max="255" value="8" aria-label="サイズのスライダー">

            <div class="number-label"><label for="offset">Yオフセット</label><span>−128〜127</span></div>
            <div class="input-row measure"><input id="offset" name="offset" type="number" min="-128" max="127" step="1" value="0" required><span id="offset-direction">元の位置</span></div>
            <input id="offset-range" type="range" min="-128" max="127" value="0" aria-label="Yオフセットのスライダー">
            <p class="field-note">正で下、負で上。0で元の位置。</p>

            <div class="toggles">
              <label class="check"><input id="shadow" name="shadow" type="checkbox" checked>影を表示</label>
              <label class="check"><input id="hat" name="hat" type="checkbox" checked>帽子レイヤーを表示</label>
            </div>
            <div class="select-row">
              <div><label for="mode">表示方法</label><select id="mode" name="mode"><option value="tellraw">tellraw</option><option value="actionbar">actionbar</option><option value="title">title</option><option value="subtitle">subtitle</option></select></div>
              <div><label for="target">表示先</label><select id="target" name="target"><option>@a</option><option>@s</option><option>@p</option><option>@r</option></select></div>
            </div>
            <button id="reset" type="reset" class="text-button">初期設定に戻す</button>
          </form>
        </section>

        <section class="preview-panel" aria-labelledby="preview-title">
          <div class="panel-heading"><h2 id="preview-title">プレビュー</h2><span>描画倍率1×の目安</span></div>
          <div class="preview-stage" id="preview-stage">
            <canvas id="preview" role="img" aria-label="頭のサイズ・位置のプレビュー"></canvas>
            <span class="zoom-badge" id="zoom-label">表示倍率 4×</span>
          </div>
          <div class="preview-footer"><span><i class="legend-square"></i>点線：元の8×8表示</span><span>左下を基準に拡縮</span></div>
          <div class="skin-actions">
            <label class="secondary upload" for="skin-file">PNGからスキンを選ぶ<input id="skin-file" type="file" accept="image/png"></label>
            <button class="text-button" type="button" id="default-skin">標準Alexに戻す</button>
          </div>
          <p class="field-note">スキン取得には<a href="https://mc-heads.net/" target="_blank" rel="noopener noreferrer">MCHeads</a>を使用します。PNGはこのブラウザー内で処理します。</p>
        </section>
      </div>

      <section class="command-panel" aria-labelledby="command-title">
        <div class="panel-heading"><h2 id="command-title">生成コマンド</h2><div class="copy-actions"><button id="copy-json" type="button" class="secondary">正規JSONをコピー</button><button id="copy-component" type="button" class="secondary">テキストコンポーネントをコピー</button><button id="copy" type="button" class="primary">コピー</button></div></div>
        <p id="error" class="error" role="alert" hidden></p>
        <textarea id="command" readonly rows="3" spellcheck="false" aria-label="生成されたMinecraftコマンド"></textarea>
        <textarea id="json-copy-fallback" readonly rows="2" spellcheck="false" aria-label="コピー用テキスト" hidden></textarea>
        <div class="encoding"><span>本体色 <code id="body-color">#fe0880</code></span><span>影色 <code id="shadow-color">−194432</code></span><span id="copy-status" role="status"></span></div>
      </section>

    </main>
    <footer><a href="https://github.com/nea-c/TextHeadGlyph" target="_blank" rel="noopener noreferrer">GitHubリポジトリ</a></footer>
  </body>
</html>
